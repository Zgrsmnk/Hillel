<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
      <div class="slides">
        <button type="submit" class="prev">Prev</button>
        <div class="slide active">
            <img src="img/1.jpg" />
        </div>
        <div class="slide">
            <img src="img/2.jpg" />
        </div>
        <div class="slide">
            <img src="img/3.jpg" />
        </div>
        <div class="slide">
            <img src="img/4.jpg" />
        </div>
        <div class="slide">
            <img src="img/5.jpg" />
        </div>
        <div class="slide">
            <img src="img/6.jpg" />
        </div>
        <div class="slide">
            <img src="img/7.jpg" />
        </div>
        <div class="slide">
            <img src="img/8.jpg" />
        </div>
        <div class="slide">
            <img src="img/9.jpg" />
        </div>
        <div class="slide">
            <img src="img/10.jpg" />
        </div>
        <button type="submit" class="next">Next</button>
      </div>
      <div class="dots">
        <span class="dot activeDot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
